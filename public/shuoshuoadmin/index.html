<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>说说管理后台</title>
  <!-- Markdown 渲染（CDN，需联网） -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --border: #e3e6ea;
      --text: #24292f;
      --muted: #6a737d;
      --accent: #2563eb;
      --danger: #dc2626;
      --admin: #7c3aed;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.6;
    }
    .container { max-width: 760px; margin: 0 auto; padding: 28px 16px 90px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px 18px; margin-bottom: 14px;
    }
    .card h3 { margin: 0 0 10px; font-size: 15px; }
    .bar, .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .bar { margin-bottom: 16px; }
    input, textarea {
      padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
      font-size: 14px; font-family: inherit;
    }
    input { flex: 1; min-width: 220px; }
    textarea {
      width: 100%; min-height: 120px; resize: vertical; margin-bottom: 10px;
      display: block;
    }
    .btn {
      padding: 7px 14px; border: 1px solid var(--border); background: #fff; border-radius: 8px;
      cursor: pointer; font-size: 13px; white-space: nowrap;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn.primary:hover { opacity: .9; color: #fff; }
    .btn.danger:hover { border-color: var(--danger); color: var(--danger); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .hint { font-size: 12px; color: var(--muted); }
    .status-ok { color: #16a34a; }
    .status-bad { color: var(--danger); }
    .post {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 16px; margin-bottom: 12px;
    }
    .post-content { font-size: 15px; word-break: break-word; }
    .post-content img { max-width: 100%; border-radius: 8px; }
    .post-meta {
      margin-top: 10px; font-size: 12px; color: var(--muted);
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    }
    .post-meta .spacer { flex: 1; }
    .replies { margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 8px; display: none; }
    .replies.open { display: block; }
    .reply { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
    .reply:last-child { border-bottom: none; }
    .reply-head { font-size: 12px; color: var(--muted); margin-bottom: 2px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .badge { background: var(--admin); color: #fff; font-size: 11px; padding: 1px 7px; border-radius: 999px; }
    .reply-content { word-break: break-word; }
    .admin-reply { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .admin-reply input { flex: 1; min-width: 100px; }
    .admin-reply .content { flex-basis: 100%; }
    .preview {
      border: 1px dashed var(--border); background: #fbfbfd; border-radius: 8px;
      padding: 10px 12px; margin-top: 8px; font-size: 14px; word-break: break-word;
    }
    .preview img { max-width: 100%; border-radius: 8px; }
    .list-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .pager { display: flex; gap: 12px; align-items: center; justify-content: center; margin-top: 16px; }
    .empty { text-align: center; color: var(--muted); padding: 40px 0; }
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #111827; color: #fff; padding: 10px 18px; border-radius: 10px;
      font-size: 14px; display: none; max-width: 90%; z-index: 99;
    }
    .footer-note { text-align: center; color: var(--muted); font-size: 12px; margin-top: 26px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>说说管理后台</h1>
    <p class="sub">连接你的 Cloudflare Worker，管理说说与回复。本页面是纯静态单文件，可部署到 Netlify、GitHub Pages 等任意静态托管。</p>

    <div class="bar">
      <input id="baseUrl" placeholder="Worker 地址，如 https://shuoshuo-worker.xxx.workers.dev" />
      <button class="btn primary" id="testBtn">测试连接</button>
      <span id="connStatus" class="hint"></span>
    </div>

    <div class="card">
      <h3>管理员登录</h3>
      <div class="row">
        <input type="password" id="password" placeholder="管理员密码" />
        <button class="btn primary" id="loginBtn">登录</button>
        <button class="btn" id="logoutBtn" style="display:none">退出登录</button>
      </div>
      <div id="loginStatus" class="hint" style="margin-top:8px"></div>
    </div>

    <div class="card" id="postBox" style="display:none">
      <h3>发布新说说</h3>
      <textarea id="newContent" placeholder="支持 Markdown，例如：**今天**天气不错～ 图片直接贴 URL：![](https://example.com/a.png)"></textarea>
      <div class="row">
        <button class="btn" id="previewBtn">预览 / 收起预览</button>
        <button class="btn primary" id="postBtn">发布</button>
      </div>
      <div id="preview" class="preview" style="display:none"></div>
    </div>

    <div class="list-head">
      <h2 style="font-size:16px;margin:0">全部说说</h2>
      <button class="btn" id="refreshBtn">刷新列表</button>
    </div>
    <div id="postList"></div>
    <div class="pager">
      <button class="btn" id="prevBtn">上一页</button>
      <span id="pageInfo" class="hint"></span>
      <button class="btn" id="nextBtn">下一页</button>
    </div>

    <div class="footer-note">
      密码不会被保存在本页面；登录后仅在当前标签页保留 24 小时有效的 token（sessionStorage）。
    </div>
  </div>

  <div id="toast"></div>

  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const state = {
        page: 1,
        pageSize: 20,
        token: sessionStorage.getItem('shuoshuo_token') || '',
        adminNickname: localStorage.getItem('shuoshuo_admin_nickname') || '博主',
        adminEmail: localStorage.getItem('shuoshuo_admin_email') || 'admin@example.com',
      };

      function toast(msg, isError) {
        const el = $('toast');
        el.textContent = msg;
        el.style.background = isError ? '#b91c1c' : '#111827';
        el.style.display = 'block';
        clearTimeout(el._t);
        el._t = setTimeout(() => { el.style.display = 'none'; }, 2600);
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (c) => (
          { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
        ));
      }

      function markdown(text) {
        const raw = window.marked ? window.marked.parse(text || '') : escapeHtml(text || '');
        return window.DOMPurify ? window.DOMPurify.sanitize(raw) : raw;
      }

      function fmtTime(s) {
        if (!s) return '';
        try { return new Date(String(s).replace(' ', 'T') + 'Z').toLocaleString('zh-CN', { hour12: false }); }
        catch { return s; }
      }

      function baseUrl() {
        const v = $('baseUrl').value.trim().replace(/\/+$/, '');
        if (!v) throw new Error('请先填写 Worker 地址');
        localStorage.setItem('shuoshuo_admin_base_url', v);
        return v;
      }

      function setToken(token) {
        state.token = token || '';
        if (token) sessionStorage.setItem('shuoshuo_token', token);
        else sessionStorage.removeItem('shuoshuo_token');
        updateLoginUI();
      }

      async function api(method, path, body, auth) {
        const headers = { 'Content-Type': 'application/json' };
        if (auth) {
          if (!state.token) throw new Error('尚未登录（缺少管理员 token）');
          headers.Authorization = 'Bearer ' + state.token;
        }
        let res;
        try {
          res = await fetch(baseUrl() + path, {
            method,
            headers,
            body: body === undefined ? undefined : JSON.stringify(body),
          });
        } catch {
          throw new Error('网络错误，无法连接 Worker，请检查地址');
        }
        let data = null;
        try { data = await res.json(); } catch { /* 非 JSON */ }
        if (!res.ok) {
          if (res.status === 401) setToken('');
          throw new Error((data && data.error) || 'HTTP ' + res.status);
        }
        return data && data.code === 0 ? data.data : data;
      }

      function updateLoginUI() {
        const loggedIn = !!state.token;
        $('loginBtn').style.display = loggedIn ? 'none' : '';
        $('logoutBtn').style.display = loggedIn ? '' : 'none';
        $('postBox').style.display = loggedIn ? '' : 'none';
        $('loginStatus').innerHTML = loggedIn
          ? '<span class="status-ok">已登录：可以发布、删除、以博主身份回复</span>'
          : '未登录：仅可查看。登录后获得发布 / 删除权限。';
        document.querySelectorAll('.admin-only').forEach((el) => { el.style.display = loggedIn ? '' : 'none'; });
      }

      async function loadList() {
        try {
          const data = await api('GET', `/api/shuoshuo?page=${state.page}&pageSize=${state.pageSize}`);
          renderList(data);
        } catch (err) {
          toast(err.message, true);
        }
      }

      function renderList(data) {
        const wrap = $('postList');
        wrap.innerHTML = '';
        if (!data.list.length) {
          wrap.innerHTML = '<div class="empty">还没有说说，登录后在上方发布第一条吧～</div>';
          $('pageInfo').textContent = '第 1 / 1 页，共 0 条';
          $('prevBtn').disabled = true;
          $('nextBtn').disabled = true;
          return;
        }
        data.list.forEach((post) => {
          const card = document.createElement('div');
          card.className = 'post';
          card.innerHTML = `
            <div class="post-content">${markdown(post.content)}</div>
            <div class="post-meta">
              <span>#${post.id}</span>
              <span>${fmtTime(post.created_at)}</span>
              <span>回复 ${post.reply_count}</span>
              <span class="spacer"></span>
              <button class="btn" data-action="toggle">查看回复</button>
              <button class="btn danger admin-only" data-action="del-post" style="display:none">删除说说</button>
            </div>
            <div class="replies" data-replies>
              <div class="hint" data-reply-count style="padding:6px 0"></div>
              <div data-reply-list></div>
              <div class="admin-reply admin-only" style="display:none">
                <input data-field="nickname" maxlength="30" placeholder="昵称（博主）">
                <input data-field="email" maxlength="100" placeholder="邮箱（仅存档）">
                <input class="content" data-field="content" maxlength="2000" placeholder="以博主身份回复…">
                <button class="btn primary" data-action="admin-reply">回复</button>
              </div>
            </div>`;
          wrap.appendChild(card);

          card.querySelector('[data-action="toggle"]').addEventListener('click', () => toggleReplies(card, post.id));
          card.querySelector('[data-action="del-post"]').addEventListener('click', async () => {
            if (!confirm(`确定删除说说 #${post.id} 及其全部回复？此操作不可恢复。`)) return;
            try {
              await api('DELETE', `/api/shuoshuo/${post.id}`, undefined, true);
              toast('已删除');
              loadList();
            } catch (err) { toast(err.message, true); }
          });
          card.querySelector('[data-action="admin-reply"]').addEventListener('click', async () => {
            const nickname = card.querySelector('[data-field="nickname"]').value.trim();
            const email = card.querySelector('[data-field="email"]').value.trim();
            const content = card.querySelector('[data-field="content"]').value.trim();
            if (!nickname || !email || !content) return toast('昵称、邮箱、回复内容都不能为空', true);
            localStorage.setItem('shuoshuo_admin_nickname', nickname);
            localStorage.setItem('shuoshuo_admin_email', email);
            try {
              await api('POST', `/api/shuoshuo/${post.id}/replies`, { nickname, email, content }, true);
              card.querySelector('[data-field="content"]').value = '';
              toast('已以博主身份回复');
              toggleReplies(card, post.id);
              loadList();
            } catch (err) { toast(err.message, true); }
          });
        });
        $('pageInfo').textContent = `第 ${data.page} / ${Math.max(1, Math.ceil(data.total / data.pageSize))} 页，共 ${data.total} 条`;
        $('prevBtn').disabled = data.page <= 1;
        $('nextBtn').disabled = !data.has_more;
        updateLoginUI();
      }

      async function toggleReplies(card, id) {
        const box = card.querySelector('[data-replies]');
        const btn = card.querySelector('[data-action="toggle"]');
        if (box.classList.contains('open')) {
          box.classList.remove('open');
          btn.textContent = '查看回复';
          return;
        }
        try {
          const detail = await api('GET', `/api/shuoshuo/${id}`);
          const listEl = box.querySelector('[data-reply-list]');
          listEl.innerHTML = '';
          box.querySelector('[data-reply-count]').textContent = `共 ${detail.replies.length} 条回复`;
          if (!detail.replies.length) {
            listEl.innerHTML = '<div class="hint" style="padding:6px 0">还没有回复</div>';
          }
          detail.replies.forEach((r) => {
            const row = document.createElement('div');
            row.className = 'reply';
            row.innerHTML = `
              <div class="reply-head">
                <span><b>${escapeHtml(r.nickname)}</b></span>
                ${r.is_admin ? '<span class="badge">博主</span>' : ''}
                <span>${fmtTime(r.created_at)}</span>
                <span class="spacer" style="flex:1"></span>
                <button class="btn danger admin-only" data-action="del-reply" style="display:none">删除</button>
              </div>
              <div class="reply-content">${markdown(r.content)}</div>`;
            row.querySelector('[data-action="del-reply"]').addEventListener('click', async () => {
              if (!confirm('确定删除这条回复？此操作不可恢复。')) return;
              try {
                await api('DELETE', `/api/replies/${r.id}`, undefined, true);
                toast('已删除回复');
                toggleReplies(card, id);
                loadList();
              } catch (err) { toast(err.message, true); }
            });
            listEl.appendChild(row);
          });
          box.classList.add('open');
          btn.textContent = '收起回复';
          // 填充博主回复默认值
          const n = box.querySelector('[data-field="nickname"]');
          const e = box.querySelector('[data-field="email"]');
          if (n) n.value = state.adminNickname;
          if (e) e.value = state.adminEmail;
          updateLoginUI();
        } catch (err) {
          toast(err.message, true);
        }
      }

      async function testConnection() {
        try {
          await api('GET', '/api/health');
          $('connStatus').innerHTML = '<span class="status-ok">连接成功 ✓</span>';
          loadList();
        } catch (err) {
          $('connStatus').innerHTML = `<span class="status-bad">连接失败：${escapeHtml(err.message)}</span>`;
        }
      }

      $('testBtn').addEventListener('click', testConnection);
      $('baseUrl').addEventListener('keydown', (e) => { if (e.key === 'Enter') testConnection(); });
      $('refreshBtn').addEventListener('click', () => { state.page = 1; loadList(); });

      $('loginBtn').addEventListener('click', async () => {
        const password = $('password').value;
        if (!password) return toast('请输入密码', true);
        try {
          const data = await api('POST', '/api/auth', { password });
          setToken(data.token);
          $('password').value = '';
          toast('登录成功');
          state.page = 1;
          loadList();
        } catch (err) { toast(err.message, true); }
      });
      $('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });

      $('logoutBtn').addEventListener('click', () => {
        setToken('');
        toast('已退出登录');
        loadList();
      });

      $('postBtn').addEventListener('click', async () => {
        const content = $('newContent').value.trim();
        if (!content) return toast('说说内容不能为空', true);
        try {
          await api('POST', '/api/shuoshuo', { content }, true);
          $('newContent').value = '';
          $('preview').style.display = 'none';
          state.page = 1;
          toast('发布成功');
          loadList();
        } catch (err) { toast(err.message, true); }
      });

      $('previewBtn').addEventListener('click', () => {
        const el = $('preview');
        if (el.style.display === 'none') {
          el.innerHTML = markdown($('newContent').value);
          el.style.display = 'block';
        } else {
          el.style.display = 'none';
        }
      });

      $('prevBtn').addEventListener('click', () => { if (state.page > 1) { state.page--; loadList(); } });
      $('nextBtn').addEventListener('click', () => { state.page++; loadList(); });

      // 初始化
      const saved = localStorage.getItem('shuoshuo_admin_base_url');
      if (saved) $('baseUrl').value = saved;
      updateLoginUI();
      if (saved) testConnection();
    })();
  </script>
</body>
</html>
